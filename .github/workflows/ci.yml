name: CI

on:
  push:
    branches:
      - main
      - agent/**
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: English-only repository text
        run: npm run check:english

      - name: Test
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Stdio smoke
        run: npm run smoke:stdio

      - name: HTTP smoke
        run: npm run smoke:http

      - name: Import smoke
        run: npm run smoke:import

      - name: Installed command smoke
        run: npm run smoke:installed

      - name: Package preview
        run: npm pack --dry-run

      - name: Dependency audit
        run: npm audit
